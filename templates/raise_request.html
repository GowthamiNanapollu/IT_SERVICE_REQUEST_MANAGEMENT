
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Raise a Service Request</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">IT Service Management</a>
        <a href="/requests" class="btn btn-outline-light btn-sm">
            View Requests
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <h1 class="h3 mb-2">Raise a Service Request</h1>
                    <p class="text-secondary mb-4">
                        Describe your issue and submit it to the IT support team.
                    </p>

                    <div id="message" class="alert d-none" role="alert"></div>

                    <form id="requestForm">

                        <div class="mb-3">
                            <label for="subject" class="form-label">
                                Subject *
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="subject"
                                maxlength="200"
                                placeholder="e.g. Laptop not working"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                Description *
                            </label>
                            <textarea
                                class="form-control"
                                id="description"
                                rows="4"
                                placeholder="Describe the issue and any error messages..."
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">
                                Category *
                            </label>
                            <select
                                class="form-select"
                                id="category"
                                required>
                                <option value="">Loading categories...</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="priority" class="form-label">
                                Priority *
                            </label>
                            <select class="form-select" id="priority" required>
                                <option value="Low">Low — SLA: 48 hours</option>
                                <option value="Medium" selected>
                                    Medium — SLA: 24 hours
                                </option>
                                <option value="High">High — SLA: 8 hours</option>
                                <option value="Critical">
                                    Critical — SLA: 4 hours
                                </option>
                            </select>
                            <div class="form-text">
                                Select the priority appropriate for your issue.
                            </div>
                        </div>

                        <button
                            type="submit"
                            id="submitButton"
                            class="btn btn-primary w-100">
                            Submit Request
                        </button>

                        <a href="/" class="btn btn-outline-secondary w-100 mt-2">
                            Cancel
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const form = document.getElementById("requestForm");
    const messageBox = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const categorySelect = document.getElementById("category");

    function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.className = `alert alert-${type}`;
    }

    async function loadCategories() {
        try {
            const response = await fetch("/api/categories");

            if (!response.ok) {
                throw new Error("Unable to load categories.");
            }

            const categories = await response.json();
            categorySelect.replaceChildren();

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "Select a category";
            categorySelect.appendChild(placeholder);

            for (const category of categories) {
                const option = document.createElement("option");
                option.value = category.category_id;
                option.textContent = category.name;
                categorySelect.appendChild(option);
            }

            if (categories.length === 0) {
                showMessage("No active categories are available.", "warning");
                submitButton.disabled = true;
            }
        } catch (error) {
            categorySelect.replaceChildren();

            const option = document.createElement("option");
            option.value = "";
            option.textContent = "Could not load categories";
            categorySelect.appendChild(option);

            showMessage(error.message, "danger");
            submitButton.disabled = true;
        }
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const subject = document.getElementById("subject").value.trim();
        const description = document.getElementById("description").value.trim();
        const categoryId = categorySelect.value;
        const priority = document.getElementById("priority").value;

        if (!subject || !description || !categoryId) {
            showMessage(
                "Please fill in all required fields.",
                "danger"
            );
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";
        messageBox.classList.add("d-none");

        try {
            const response = await fetch("/api/requests", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    requester_id: 1,
                    category_id: Number(categoryId),
                    subject: subject,
                    description: description,
                    priority: priority
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error || "Unable to submit the request."
                );
            }

            form.reset();

            showMessage(
                `Request #${result.request_id} created successfully! ` +
                "Your request is now New.",
                "success"
            );

            const viewButton = document.createElement("a");
            viewButton.href = "/requests";
            viewButton.className = "btn btn-success w-100 mt-3";
            viewButton.textContent = "View All Requests";
            messageBox.appendChild(viewButton);

        } catch (error) {
            showMessage(error.message, "danger");
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Submit Request";
        }
    });

    loadCategories();
</script>

</body>
</html>
