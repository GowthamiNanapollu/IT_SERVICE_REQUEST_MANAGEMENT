
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IT Service Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f5f7fb;
        }

        .dashboard-container {
            max-width: 1400px;
        }

        .dashboard-title {
            font-size: 1.5rem;
        }

        .stat-card .card-body {
            padding: 12px 16px;
        }

        .stat-card p {
            font-size: 0.85rem;
        }

        .stat-card h2 {
            font-size: 1.65rem;
        }

        .chart-card .card-body {
            padding: 14px;
        }

        /* Fixed height prevents oversized charts */
        .chart-wrap {
            position: relative;
            width: 100%;
            height: 230px;
        }

        .chart-wrap canvas {
            max-width: 100%;
        }

        @media (max-width: 767px) {
            .chart-wrap {
                height: 220px;
            }

            .dashboard-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
<nav class="navbar navbar-dark bg-primary py-2">
    <div class="container-fluid dashboard-container px-3">
        <a class="navbar-brand" href="/">IT Service Management</a>

        <div class="d-flex align-items-center gap-2">
            <span class="text-white small d-none d-sm-inline">
                {{ session.get('email', '') }}
            </span>
            <a href="{{ url_for('logout') }}"
               class="btn btn-outline-light btn-sm">
                Logout
            </a>
        </div>
    </div>
</nav>

<main class="container-fluid dashboard-container px-3 px-lg-4 py-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="dashboard-title mb-0">Reporting Dashboard</h1>

        <button onclick="loadDashboard()"
                class="btn btn-sm btn-outline-secondary">
            Refresh
        </button>
    </div>

    <div id="errorMessage"
         class="alert alert-danger d-none py-2"
         role="alert"></div>

    <!-- Summary cards -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-2 mb-3">

        <div class="col">
            <div class="card border-0 shadow-sm h-100 stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Total Requests</p>
                    <h2 id="total" class="mb-0">—</h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card border-0 shadow-sm h-100 stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Open</p>
                    <h2 id="open" class="mb-0">—</h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card border-0 shadow-sm h-100 stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Resolved</p>
                    <h2 id="resolved" class="mb-0">—</h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card border-0 shadow-sm h-100 stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Closed</p>
                    <h2 id="closed" class="mb-0">—</h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card border-0 shadow-sm h-100 stat-card">
                <div class="card-body">
                    <p class="text-secondary mb-1">Overdue</p>
                    <h2 id="overdue" class="mb-0">—</h2>
                </div>
            </div>
        </div>

    </div>

    <!-- Charts -->
    <div class="row g-3">

        <div class="col-12 col-lg-6">
            <div class="card border-0 shadow-sm h-100 chart-card">
                <div class="card-body">
                    <h2 class="h6 mb-2">Requests by Status</h2>

                    <div class="chart-wrap">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card border-0 shadow-sm h-100 chart-card">
                <div class="card-body">
                    <h2 class="h6 mb-2">Requests by Priority</h2>

                    <div class="chart-wrap">
                        <canvas id="priorityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="d-flex flex-wrap gap-2 mt-3">
        <a href="/requests" class="btn btn-sm btn-primary">
            View Requests
        </a>

        <button onclick="loadDashboard()"
                class="btn btn-sm btn-outline-secondary">
            Refresh Dashboard
        </button>
    </div>

</main>

<script>
    let statusChart;
    let priorityChart;

    async function loadDashboard() {
        const errorBox = document.getElementById("errorMessage");
        errorBox.classList.add("d-none");

        try {
            const response = await fetch("/api/reports/summary", {
                credentials: "same-origin"
            });

            if (!response.ok) {
                throw new Error("Unable to load dashboard data.");
            }

            const data = await response.json();
            const summary = data.summary;

            document.getElementById("total").textContent =
                summary.total_requests ?? 0;

            document.getElementById("open").textContent =
                summary.open_requests ?? 0;

            document.getElementById("resolved").textContent =
                summary.resolved_requests ?? 0;

            document.getElementById("closed").textContent =
                summary.closed_requests ?? 0;

            document.getElementById("overdue").textContent =
                summary.overdue_requests ?? 0;

            if (statusChart) statusChart.destroy();
            if (priorityChart) priorityChart.destroy();

            // Status bar chart
            statusChart = new Chart(
                document.getElementById("statusChart"),
                {
                    type: "bar",
                    data: {
                        labels: Object.keys(data.by_status || {}),
                        datasets: [{
                            label: "Requests",
                            data: Object.values(data.by_status || {}),
                            backgroundColor: "rgba(54, 162, 235, 0.6)",
                            borderColor: "rgb(54, 162, 235)",
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0,
                                    maxTicksLimit: 5
                                }
                            },
                            x: {
                                ticks: {
                                    maxRotation: 0,
                                    minRotation: 0
                                }
                            }
                        }
                    }
                }
            );

            // Compact doughnut chart
            priorityChart = new Chart(
                document.getElementById("priorityChart"),
                {
                    type: "doughnut",
                    data: {
                        labels: Object.keys(data.by_priority || {}),
                        datasets: [{
                            label: "Requests",
                            data: Object.values(data.by_priority || {}),
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: "65%",
                        layout: {
                            padding: 4
                        },
                        plugins: {
                            legend: {
                                position: "bottom",
                                labels: {
                                    boxWidth: 12,
                                    padding: 10
                                }
                            }
                        }
                    }
                }
            );

        } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove("d-none");
        }
    }

    loadDashboard();
</script>

</body>
</html>
